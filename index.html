<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mail System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Cairo', 'Segoe UI', sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  .msg-item { transition: all 0.15s ease; cursor: pointer; }
  .msg-item:hover { background: #f3f4f6; }
  .msg-item.active { background: #e5f0fa; border-right: 3px solid #0078D4; }
  .fade-in { animation: fadeIn 0.2s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .modal-overlay { animation: modalIn 0.2s ease-out; }
  @keyframes modalIn { from { opacity: 0; } to { opacity: 1; } }
  #sidebar { transition: margin-right 0.25s ease; }
  #sidebar.collapsed { margin-right: -16rem; }

  /* Inbox responsive */
  .inbox-reading { display: none; }
  @media (min-width: 768px) {
    .inbox-reading { display: flex; }
    .inbox-list { display: flex; }
  }
  @media (max-width: 767px) {
    .inbox-list { display: flex; }
    .inbox-list.mobile-hidden { display: none; }
    .inbox-reading.mobile-show { display: flex; }
  }

  /* Notification pulse */
  .pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
</style>
</head>
<body class="bg-[#f3f2f1] min-h-screen">

<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#0078D4] via-[#106EBE] to-[#0a4a8a]">

    <div class="flex justify-center mb-6">
      <div class="w-16 h-16 rounded-2xl bg-[#0078D4] flex items-center justify-center shadow-lg">
        <i data-lucide="mail" class="w-8 h-8 text-white"></i>
      </div>
    </div>
    <h1 class="text-2xl font-bold text-center mb-1 text-slate-800">Mail System</h1>
    <p class="text-center text-slate-500 text-sm mb-8">سجّل دخولك للمتابعة</p>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1.5 text-slate-700">اسم المستخدم أو الإيميل</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 absolute top-1/2 -translate-y-1/2 right-3 text-slate-400"></i>
          <input id="loginUser" type="text" placeholder="admin أو user@example.com" class="w-full border border-slate-300 rounded-lg pr-10 pl-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#0078D4] focus:border-transparent transition" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1.5 text-slate-700">كلمة السر</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 absolute top-1/2 -translate-y-1/2 right-3 text-slate-400"></i>
          <input id="loginPass" type="password" placeholder="••••••" class="w-full border border-slate-300 rounded-lg pr-10 pl-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#0078D4] focus:border-transparent transition" />
        </div>
      </div>
      <p id="loginError" class="text-red-600 text-sm hidden bg-red-50 p-2 rounded border border-red-200"></p>
      <button id="loginBtn" class="w-full bg-[#0078D4] hover:bg-[#106EBE] text-white font-semibold rounded-lg py-2.5 transition flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>دخول</span>

</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden min-h-screen flex flex-col">
  <header class="h-14 bg-white border-b border-slate-200 flex items-center px-3 md:px-4 gap-2 md:gap-3 sticky top-0 z-40">
    <button id="toggleSidebar" class="p-2 rounded-lg hover:bg-slate-100 transition text-slate-600" title="إظهار/إخفاء القائمة">

    <div class="flex items-center gap-2 md:gap-3">

      </div>

    <div class="flex-1 max-w-2xl relative hidden sm:block">
      <i data-lucide="search" class="w-4 h-4 absolute top-1/2 -translate-y-1/2 right-3 text-slate-400"></i>

<!-- ============ TOAST ============ -->
<div id="toastContainer" class="fixed top-20 left-4 z-[100] space-y-2"></div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc,
  query, where, serverTimestamp, onSnapshot, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZTWVHsdv0U3XSEFyZG9RtVNJJwiTxPBA",
  authDomain: "email-system-51538.firebaseapp.com",
  projectId: "email-system-51538",
  storageBucket: "email-system-51538.firebasestorage.app",
  messagingSenderId: "520124834460",
  appId: "1:520124834460:web:98114c58001ddd2be3c359"
};

const EMAIL_DOMAIN = "algharbawy.com";
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser = null;
let allUsersCache = [];
let sidebarCollapsed = false;
let unsubMessages = null;
let unreadMessages = [];
let lastUnreadCount = 0;

const $  = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const show = (el) => { if (el) el.classList.remove('hidden'); };
const hide = (el) => { if (el) el.classList.add('hidden'); };
const esc  = (s='') => s.toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = (name='') => name.trim().split(/\s+/).slice(0,2).map(w => w[0]||'').join('').toUpperCase() || '?';
const icons = () => window.lucide && window.lucide.createIcons();
const timeAgo = (ts) => {
  if (!ts || !ts.seconds) return '';
  const d = new Date(ts.seconds * 1000);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'الآن';
  if (diff < 3600) return `منذ ${Math.floor(diff/60)} د`;
  if (diff < 86400) return `منذ ${Math.floor(diff/3600)} س`;
  if (diff < 604800) return `منذ ${Math.floor(diff/86400)} ي`;
  return d.toLocaleDateString('ar-EG');
};
const fullDate = (ts) => {
  if (!ts || !ts.seconds) return '';
  return new Date(ts.seconds * 1000).toLocaleString('ar-EG', {
    weekday:'long', year:'numeric', month:'long', day:'numeric',
    hour:'2-digit', minute:'2-digit'
  });
};
const isOwner = () => currentUser?.role === 'owner';
const isAdmin = () => currentUser?.role === 'admin' || isOwner();

/* ---------- Toast Notifications ---------- */
function showToast(title, body, onClick) {
  const container = $('#toastContainer');
  const toast = document.createElement('div');
  toast.className = 'bg-white rounded-xl shadow-2xl border-r-4 border-[#0078D4] p-4 min-w-[300px] max-w-sm cursor-pointer fade-in';
  toast.innerHTML = `
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-full bg-[#e5f0fa] flex items-center justify-center flex-shrink-0">
        <i data-lucide="mail" class="w-5 h-5 text-[#0078D4]"></i>
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-bold text-sm text-slate-800 truncate">${esc(title)}</div>
        <div class="text-xs text-slate-600 mt-0.5 truncate">${esc(body)}</div>
      </div>
      <button class="p-1 hover:bg-slate-100 rounded flex-shrink-0">
        <i data-lucide="x" class="w-4 h-4 text-slate-400"></i>
      </button>
    </div>
  `;
  toast.querySelector('button').onclick = (e) => { e.stopPropagation(); toast.remove(); };
  if (onClick) toast.onclick = () => { onClick(); toast.remove(); };
  container.appendChild(toast);
  icons();
  setTimeout(() => toast.remove(), 6000);
}

/* ---------- Browser Notification ---------- */
function requestBrowserNotifPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}
function showBrowserNotif(title, body, onClick) {
  if ('Notification' in window && Notification.permission === 'granted') {
    const n = new Notification(title, { body, icon: 'https://www.gstatic.com/images/branding/product/1x/gmail_2020q4_48dp.png' });
    if (onClick) n.onclick = () => { window.focus(); onClick(); };
  }
}

/* ---------- Real-time Messages Listener ---------- */
function startMessagesListener() {
  if (unsubMessages) unsubMessages();
  const q = query(collection(db, 'messages'), where('toUserId', '==', currentUser.uid));
  unsubMessages = onSnapshot(q, (snap) => {
    const all = [];
    snap.forEach(d => all.push({ id: d.id, ...d.data() }));
    all.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    
    unreadMessages = all.filter(m => !m.read);
    updateNotificationUI();
    
    // Detect new messages
    if (lastUnreadCount > 0 && unreadMessages.length > lastUnreadCount) {
      const newMsg = unreadMessages[0];
      if (newMsg && newMsg.fromUserId !== currentUser.uid) {
        showToast(`رسالة جديدة من ${newMsg.fromUserName}`, newMsg.subject, () => {
          navigate('inbox');
          setTimeout(() => selectMsg(newMsg.id), 300);
        });
        showBrowserNotif(`رسالة جديدة من ${newMsg.fromUserName}`, newMsg.subject, () => {
          navigate('inbox');
          setTimeout(() => selectMsg(newMsg.id), 300);
        });
      }
    }
    lastUnreadCount = unreadMessages.length;
  });
}

function updateNotificationUI() {
  const count = unreadMessages.length;
  const el = $('#inboxCount');
  const elM = $('#inboxCountM');
  const notifBadge = $('#notifBadge');
  
  if (count > 0) {
    if (el) { el.textContent = count; show(el); }
    if (elM) { elM.textContent = count; show(elM); }
    if (notifBadge) {
      notifBadge.textContent = count > 9 ? '9+' : count;
      notifBadge.classList.remove('hidden');
      notifBadge.classList.add('pulse');
    }
  } else {
    if (el) hide(el);
    if (elM) hide(elM);
    if (notifBadge) {
      notifBadge.classList.add('hidden');
      notifBadge.classList.remove('pulse');
    }
  }
  renderNotifDropdown();
}

function renderNotifDropdown() {
  const list = $('#notifList');
  if (!list) return;
  if (unreadMessages.length === 0) {
    list.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">
      <i data-lucide="bell-off" class="w-10 h-10 mx-auto mb-2 opacity-40"></i>
      <p>لا إشعارات جديدة</p>
    </div>`;
    icons();
    return;
  }
  list.innerHTML = unreadMessages.slice(0, 10).map(m => `
    <div onclick="openNotifMsg('${m.id}')" class="px-4 py-3 border-b border-slate-100 hover:bg-slate-50 cursor-pointer transition flex items-start gap-3">
      <div class="w-9 h-9 rounded-full bg-[#0078D4] text-white flex items-center justify-center font-bold text-xs flex-shrink-0">${initials(m.fromUserName)}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2">
          <span class="font-semibold text-sm text-slate-800 truncate">${esc(m.fromUserName)}</span>
          <span class="text-xs text-slate-400 flex-shrink-0">${timeAgo(m.createdAt)}</span>
        </div>
        <div class="text-sm text-slate-700 truncate">${esc(m.subject)}</div>
        <div class="text-xs text-slate-400 truncate mt-0.5">${esc((m.body||'').slice(0,60))}</div>
      </div>
    </div>
  `).join('');
  icons();
}

window.openNotifMsg = (id) => {
  hideNotifDropdown();
  navigate('inbox');
  setTimeout(() => selectMsg(id), 300);
};

window.markAllRead = async () => {
  if (unreadMessages.length === 0) return;
  const batch = writeBatch(db);
  unreadMessages.forEach(m => {
    batch.update(doc(db, 'messages', m.id), { read: true });
  });
  await batch.commit();
  hideNotifDropdown();
};

function showNotifDropdown() { $('#notifDropdown').style.display = 'block'; }
function hideNotifDropdown() { $('#notifDropdown').style.display = 'none'; }

/* ---------- Sidebar Toggle ---------- */
function toggleSidebar() {
  const sidebar = $('#sidebar');
  sidebarCollapsed = !sidebarCollapsed;
  if (sidebarCollapsed) sidebar.classList.add('collapsed');
  else sidebar.classList.remove('collapsed');
  try { localStorage.setItem('sidebarCollapsed', sidebarCollapsed ? '1' : '0'); } catch(e){}
}

function initSidebar() {
  const sidebar = $('#sidebar');
  const mobileNav = $('#mobileNav');
  const main = $('#mainContent');

  try {
    const saved = localStorage.getItem('sidebarCollapsed');
    if (saved === '1') { sidebarCollapsed = true; sidebar.classList.add('collapsed'); }
  } catch(e){}

  const update = () => {
    if (window.innerWidth < 768) {
      sidebar.style.display = 'none';
      mobileNav.style.display = 'flex';
      main.classList.add('pb-16');
    } else {
      sidebar.style.display = 'flex';
      mobileNav.style.display = 'none';
      main.classList.remove('pb-16');
    }
  };
  update();
  window.addEventListener('resize', update);
}

/* ---------- Create Auth User ---------- */
async function createAuthUser(email, password) {
  const secondaryApp = initializeApp(firebaseConfig, 'Sec-' + Date.now());
  const secondaryAuth = getAuth(secondaryApp);
  try {
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
    const uid = cred.user.uid;
    await signOut(secondaryAuth);
    await deleteApp(secondaryApp);
    return uid;
  } catch (e) {
    await deleteApp(secondaryApp);
    throw e;
  }
}

$('#loginBtn').onclick = async () => {

  try {

      'auth/wrong-password': 'كلمة السر غلط',
      'auth/invalid-credential': 'بيانات الدخول غير صحيحة',
      'auth/invalid-email': 'الإيميل غير صحيح',
      'auth/unauthorized-domain': 'الدومين غير مسموح في Firebase',

/* ---------- Auth State ---------- */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    currentUser = null;
    if (unsubMessages) { unsubMessages(); unsubMessages = null; }
    show($('#loginScreen'));
    hide($('#app'));
    return;
  }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists()) { alert('لا يوجد ملف مستخدم في Firestore'); await signOut(auth); return; }
  currentUser = { uid: user.uid, ...snap.data() };
  if (currentUser.isActive === false) { alert('الحساب معطّل'); await signOut(auth); return; }

  $('#userName').textContent = currentUser.name;
  const roleLabels = { owner: 'صاحب الشركة', admin: 'مدير النظام', manager: 'مدير', user: 'مستخدم' };
  $('#userRole').textContent = roleLabels[currentUser.role] || currentUser.role;
  $('#userAvatar').textContent = initials(currentUser.name);

  const admin = isAdmin();
  $$('[data-admin-only]').forEach(el => {
    if (admin) el.classList.remove('hidden');
    else el.classList.add('hidden');
  });

  await loadUsersCache();

  hide($('#loginScreen'));
  show($('#app'));
  icons();
  initSidebar();
  navigate('dashboard');

  // ابدأ الإشعارات الحية
  startMessagesListener();
  requestBrowserNotifPermission();
});

window.createNewUser = async () => {
  const name = $('#nuName').value.trim();
  const user = $('#nuUser').value.trim().toLowerCase();
  const pass = $('#nuPass').value;
  const role = $('#nuRole').value;
  const err = $('#nuErr');
  hide(err);
  if (!name || !user || !pass) { err.className='text-sm mt-3 text-red-600'; err.textContent='املأ كل البيانات'; show(err); return; }

  err.className = 'text-sm mt-3 text-blue-600'; err.textContent = 'جاري الإنشاء...'; show(err);
  try {
    const email = `${user}@${EMAIL_DOMAIN}`;
    const uid = await createAuthUser(email, pass);
    await setDoc(doc(db, 'users', uid), {
      name, username: user, email, role, isActive: true, createdAt: serverTimestamp()
    });
    err.className = 'text-sm mt-3 text-green-600'; err.textContent = `✅ تم إنشاء ${user} بنجاح!`;
    $('#nuName').value = ''; $('#nuUser').value = ''; $('#nuPass').value = '';
    setTimeout(() => { hide($('#addUserForm')); users(); }, 1200);
  } catch (e) {
    err.className = 'text-sm mt-3 text-red-600';
    err.textContent = e.code === 'auth/email-already-in-use' ? 'اسم المستخدم ده مستخدم قبل كده' : e.message;

      <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-800">الأقسام</h1>
        <p class="text-slate-500 text-sm mt-1">${list.length} قسم</p>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <input id="dName" placeholder="اسم القسم" class="border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0078D4]" />
          <input id="dDesc" placeholder="وصف (اختياري)" class="border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0078D4]" />
          <button onclick="addDept()" class="bg-[#0078D4] hover:bg-[#106EBE] text-white rounded-lg px-4 py-2.5 text-sm font-semibold transition flex items-center justify-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>إضافة قسم</span>
          </button>
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        ${cards || '<div class="col-span-full text-center py-12 text-slate-400">لا يوجد أقسام بعد</div>'}
      </div>
    </div>
  `;
  icons();
}
window.addDept = async () => {
  const name = $('#dName').value.trim();
  const description = $('#dDesc').value.trim();
  if (!name) return alert('اكتب اسم القسم');
  await addDoc(collection(db, 'departments'), { name, description, createdAt: serverTimestamp() });
  departments();
};
window.deleteDept = async (id) => {
  if (!confirm('حذف القسم؟')) return;
  await deleteDoc(doc(db, 'departments', id));
  departments();
};

/* ---------- Compose Modal ---------- */
window.openCompose = async () => {
  await loadUsersCache();
  const others = allUsersCache.filter(u => u.id !== currentUser.uid && u.isActive !== false);
  $('#cTo').innerHTML = `<option value="">— اختر المستلم —</option>` + others.map(u =>
    `<option value="${u.id}">${esc(u.name)} (${esc(u.username)})</option>`
  ).join('');
  $('#cSubject').value = '';
  $('#cBody').value = '';
  $('#cBroadcast').checked = false;
  $('#toBox').classList.remove('hidden');
  hide($('#cStatus'));

  if (isOwner()) {
    $('#broadcastCount').textContent = others.length;
    $('#broadcastBox').style.display = 'block';
  }
  $('#composeModal').style.display = 'flex';
  icons();
  setTimeout(() => $('#cTo').focus(), 100);
};

window.closeCompose = () => { $('#composeModal').style.display = 'none'; };

window.toggleBroadcast = () => {
  const checked = $('#cBroadcast').checked;
  if (checked) hide($('#toBox'));
  else show($('#toBox'));
};

$('#composeModal').addEventListener('click', e => {
  if (e.target.id === 'composeModal') closeCompose();
});

window.sendMessage = async () => {
  const broadcast = isOwner() && $('#cBroadcast').checked;
  const toUserId = $('#cTo').value;
  const subject = $('#cSubject').value.trim();
  const body = $('#cBody').value.trim();
  const status = $('#cStatus');
  const sendBtn = $('#sendBtn');
  hide(status);

  if (!broadcast && !toUserId) { status.className='text-sm text-red-600'; status.textContent='اختر المستلم'; show(status); return; }
  if (!subject) { status.className='text-sm text-red-600'; status.textContent='اكتب الموضوع'; show(status); return; }

  sendBtn.disabled = true;
  sendBtn.querySelector('span').textContent = broadcast ? 'جاري الإرسال للجميع...' : 'جاري الإرسال...';

  try {
    if (broadcast) {
      const recipients = allUsersCache.filter(u => u.id !== currentUser.uid && u.isActive !== false);
      let sent = 0;
      for (const u of recipients) {
        await addDoc(collection(db, 'messages'), {
          subject, body,
          fromUserId: currentUser.uid,
          fromUserName: currentUser.name,
          fromUserUsername: currentUser.username,
          toUserId: u.id, toUserName: u.name,
          read: false, isBroadcast: true,
          createdAt: serverTimestamp()
        });
        sent++;
        status.className = 'text-sm text-blue-600';
        status.textContent = `جاري الإرسال... ${sent}/${recipients.length}`;
        show(status);
      }
      status.className = 'text-sm text-green-600';
      status.textContent = `✅ تم إرسال الرسالة إلى ${recipients.length} مستخدم!`;
      show(status);
    } else {
      const toUser = allUsersCache.find(u => u.id === toUserId);
      await addDoc(collection(db, 'messages'), {
        subject, body,
        fromUserId: currentUser.uid,
        fromUserName: currentUser.name,
        fromUserUsername: currentUser.username,
        toUserId, toUserName: toUser?.name || '',
        read: false,
        createdAt: serverTimestamp()
      });
      status.className = 'text-sm text-green-600';
      status.textContent = '✅ تم الإرسال!';
      show(status);
    }
    setTimeout(() => { closeCompose(); }, 1000);
  } catch (e) {
    status.className = 'text-sm text-red-600';
    status.textContent = e.message;
    show(status);
  } finally {
    sendBtn.disabled = false;
    sendBtn.querySelector('span').textContent = 'إرسال';
  }
};

/* ---------- Inbox ---------- */
let selectedMsgId = null;
let inboxList = [];

async function inbox() {
  const q = query(collection(db, 'messages'), where('toUserId', '==', currentUser.uid));
  const snap = await getDocs(q);
  inboxList = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  selectedMsgId = null;
  renderInbox();
}

function renderInbox() {
  const listHtml = inboxList.map(m => `
    <div onclick="selectMsg('${m.id}')" class="msg-item ${m.id === selectedMsgId ? 'active' : ''} px-4 py-3 border-b border-slate-100">
      <div class="flex items-start gap-3">
        <div class="relative">
          <div class="w-9 h-9 rounded-full bg-[#0078D4] text-white flex items-center justify-center font-bold text-xs flex-shrink-0">${initials(m.fromUserName)}</div>
          ${m.isBroadcast ? '<div class="absolute -bottom-1 -right-1 w-4 h-4 bg-amber-500 rounded-full flex items-center justify-center"><i data-lucide="megaphone" class="w-2.5 h-2.5 text-white"></i></div>' : ''}
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2">
            <span class="text-sm text-slate-800 truncate ${!m.read ? 'font-bold' : 'font-medium'}">${esc(m.fromUserName || '')}</span>
            <span class="text-xs text-slate-400 flex-shrink-0">${timeAgo(m.createdAt)}</span>
          </div>
          <div class="text-sm text-slate-700 truncate ${!m.read ? 'font-semibold' : ''}">${esc(m.subject)}</div>
          <div class="text-xs text-slate-400 truncate mt-0.5">${esc((m.body || '').slice(0, 60))}</div>
          ${m.isBroadcast ? '<div class="text-xs text-amber-600 font-medium mt-0.5">📢 إعلان عام</div>' : ''}
        </div>
      </div>
    </div>
  `).join('');

  $('#pageContent').innerHTML = `
    <div id="inboxContainer" class="h-full flex fade-in">
      <div id="inboxList" class="inbox-list w-full md:w-96 border-l border-slate-200 bg-white flex-col">
        <div class="p-4 border-b border-slate-200 bg-white z-10 flex-shrink-0">
          <h2 class="font-bold text-slate-800">صندوق الوارد</h2>
          <p class="text-xs text-slate-500 mt-0.5">${inboxList.length} رسالة · ${inboxList.filter(m => !m.read).length} غير مقروءة</p>
        </div>
        <div class="flex-1 overflow-y-auto">
          ${listHtml || '<div class="text-center py-12 text-slate-400 text-sm">لا رسائل</div>'}
        </div>
      </div>
      <div id="inboxReading" class="inbox-reading flex-1 bg-white overflow-y-auto flex-col">
        <div id="readingContent" class="flex-1"></div>
      </div>
    </div>
  `;
  renderReading();
  icons();
}

function renderReading() {
  const selected = inboxList.find(m => m.id === selectedMsgId);
  const content = $('#readingContent');
  if (!content) return;

  if (!selected) {
    content.innerHTML = `
      <div class="flex flex-col items-center justify-center h-full text-slate-400 p-8 min-h-[400px]">
        <i data-lucide="mail-open" class="w-16 h-16 mb-4 opacity-40"></i>
        <p class="text-sm">اختر رسالة لعرضها</p>
      </div>`;
    icons();
    return;
  }

  content.innerHTML = `
    <div class="p-4 md:p-8 fade-in">
      <button onclick="backToList()" class="md:hidden mb-4 flex items-center gap-2 text-[#0078D4] font-medium text-sm">
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
        <span>رجوع للقائمة</span>
      </button>

      <div class="flex items-start justify-between gap-4 mb-6">
        <div class="flex-1 min-w-0">
          <h1 class="text-xl md:text-2xl font-bold text-slate-800 mb-2 break-words">${esc(selected.subject)}</h1>
          ${selected.isBroadcast ? '<span class="inline-flex items-center gap-1 text-xs bg-amber-100 text-amber-800 px-2.5 py-1 rounded-full font-semibold"><i data-lucide="megaphone" class="w-3 h-3"></i>إعلان عام</span>' : ''}
        </div>
        <div class="flex items-center gap-1 flex-shrink-0">
          ${!selected.read ? `<button onclick="markRead('${selected.id}', true)" class="p-2 rounded-lg hover:bg-blue-50 text-blue-600 transition" title="تحديد كمقروء"><i data-lucide="mail-open" class="w-4 h-4"></i></button>` : ''}
          ${selected.read ? `<button onclick="markRead('${selected.id}', false)" class="p-2 rounded-lg hover:bg-blue-50 text-blue-600 transition" title="تحديد كغير مقروء"><i data-lucide="mail" class="w-4 h-4"></i></button>` : ''}
          <button onclick="deleteMsg('${selected.id}')" class="p-2 rounded-lg hover:bg-red-50 text-red-600 transition" title="حذف"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
      </div>

      <div class="bg-slate-50 rounded-xl p-4 mb-6 border border-slate-200">
        <div class="flex items-start gap-3">
          <div class="w-12 h-12 rounded-full bg-[#0078D4] text-white flex items-center justify-center font-bold text-base flex-shrink-0">${initials(selected.fromUserName)}</div>
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-baseline gap-2">
              <span class="font-bold text-slate-800">${esc(selected.fromUserName)}</span>
              ${selected.fromUserUsername ? `<span class="text-xs font-mono text-slate-400">@${esc(selected.fromUserUsername)}</span>` : ''}
            </div>
            <div class="text-xs text-slate-500 mt-1 flex flex-wrap items-center gap-2">
              <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i>${fullDate(selected.createdAt)}</span>
            </div>
            <div class="text-xs text-slate-500 mt-0.5 flex items-center gap-1">
              <i data-lucide="user" class="w-3 h-3"></i>
              <span>إلى: ${esc(currentUser.name)}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="bg-white border border-slate-200 rounded-xl p-5 md:p-6 mb-6">
        <div class="text-slate-700 whitespace-pre-line leading-loose text-base">${esc(selected.body || '')}</div>
      </div>

      <div class="flex flex-wrap gap-2 pt-4 border-t border-slate-200">
        <button onclick="replyTo('${selected.fromUserId}', '${esc(selected.subject).replace(/'/g,"\\'")}')" class="bg-[#0078D4] hover:bg-[#106EBE] text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition shadow-sm">
          <i data-lucide="reply" class="w-4 h-4"></i>
          <span>رد</span>
        </button>
        <button onclick="deleteMsg('${selected.id}')" class="bg-white hover:bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
          <span>حذف</span>
        </button>
      </div>
    </div>
  `;
  icons();
}

window.selectMsg = (id) => {
  selectedMsgId = id;
  renderInbox();
  // على الموبايل: اخفي القائمة واظهر الرسالة
  if (window.innerWidth < 768) {
    const list = $('#inboxList');
    const reading = $('#inboxReading');
    if (list) list.classList.add('mobile-hidden');
    if (reading) {
      reading.classList.remove('mobile-hidden');
      reading.classList.add('mobile-show');
    }
  }
  const m = inboxList.find(x => x.id === id);
  if (m && !m.read) {
    setTimeout(() => markRead(id, true), 500);
  }
};

window.backToList = () => {
  const list = $('#inboxList');
  const reading = $('#inboxReading');
  if (list) list.classList.remove('mobile-hidden');
  if (reading) reading.classList.remove('mobile-show');
  selectedMsgId = null;
  renderInbox();
};

window.markRead = async (id, read = true) => {
  await updateDoc(doc(db, 'messages', id), { read });
  const m = inboxList.find(x => x.id === id);
  if (m) m.read = read;
  renderInbox();
  // على الموبايل: اقفل القائمة وارجع للرسالة
  if (selectedMsgId && window.innerWidth < 768) {
    const list = $('#inboxList');
    const reading = $('#inboxReading');
    if (list) list.classList.add('mobile-hidden');
    if (reading) reading.classList.add('mobile-show');
  }
};

window.deleteMsg = async (id) => {
  if (!confirm('حذف الرسالة؟')) return;
  await deleteDoc(doc(db, 'messages', id));
  inboxList = inboxList.filter(m => m.id !== id);
  selectedMsgId = null;
  backToList();
};

window.replyTo = async (userId, subject) => {
  await openCompose();
  $('#cTo').value = userId;
  $('#cSubject').value = subject.startsWith('رد:') ? subject : 'رد: ' + subject;
  $('#cBroadcast').checked = false;
  $('#toBox').classList.remove('hidden');
  setTimeout(() => $('#cBody').focus(), 150);
};

/* ---------- Sent ---------- */
async function sent() {
  const q = query(collection(db, 'messages'), where('fromUserId', '==', currentUser.uid));
  const snap = await getDocs(q);
  const list = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));

  const grouped = {};
  const unique = [];
  list.forEach(m => {
    if (m.isBroadcast && m.createdAt?.seconds) {
      const key = `${m.subject}_${m.createdAt.seconds}_${m.body?.slice(0,20)}`;
      if (!grouped[key]) {
        grouped[key] = { ...m, count: 1 };
        unique.push(grouped[key]);
      } else grouped[key].count++;
    } else unique.push({ ...m, count: 1 });
  });

  const rows = unique.map(m => `
    <div class="px-4 py-3 border-b border-slate-100 hover:bg-slate-50 transition">
      <div class="flex items-start gap-3">
        <div class="w-9 h-9 rounded-full ${m.isBroadcast ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'} flex items-center justify-center flex-shrink-0">
          <i data-lucide="${m.isBroadcast ? 'megaphone' : 'send'}" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2">
            <span class="font-semibold text-sm text-slate-800 truncate">
              ${m.isBroadcast ? `📢 إعلان عام (${m.count} مستلم)` : `إلى: ${esc(m.toUserName || '')}`}
            </span>
            <span class="text-xs text-slate-400 flex-shrink-0">${timeAgo(m.createdAt)}</span>
          </div>
          <div class="text-sm text-slate-700 truncate">${esc(m.subject)}</div>
          <div class="text-xs text-slate-400 truncate mt-0.5">${esc((m.body || '').slice(0, 80))}</div>
        </div>
      </div>
    </div>
  `).join('');

  $('#pageContent').innerHTML = `
    <div class="p-4 md:p-8 max-w-4xl mx-auto fade-in">
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-800">الرسائل المُرسلة</h1>
        <p class="text-slate-500 text-sm mt-1">${list.length} رسالة</p>
      </div>
      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
        ${rows || '<div class="text-center py-12 text-slate-400">لا رسائل مُرسلة</div>'}
      </div>
    </div>
  `;
  icons();
}

icons();
window.addEventListener('load', icons);
</script>
</body>
</html>
